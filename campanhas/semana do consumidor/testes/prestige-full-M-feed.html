<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; font-family:'Archivo', Arial, sans-serif; background:#fff; overflow:hidden; }

  .topbar { height:16px; width:100%; background:#CC9933; }

  .header { text-align:center; padding:44px 40px 24px; }

  .header .line2 { font-family:'Anton', Arial, sans-serif; font-size:100px; color:#CC9933; letter-spacing:1px; line-height:0.95; margin-top:-6px; }

  .card { position:relative; margin:10px 36px 0; height:640px; border-radius:32px; overflow:hidden; background:#000; }

  .tag {

    padding:18px 26px 20px; border-radius:0 24px 24px 0;

  .tag .p1 { font-family:'Anton', Arial, sans-serif; color:#CC9933; font-size:34px; letter-spacing:1px; }
  .tag .p2 { font-family:'Anton', Arial, sans-serif; color:#fff; font-size:76px; line-height:0.9; margin-top:-4px; }

  .goldpanel {
    position:absolute; top:0; right:0; width:340px; height:100%; z-index:3;
    background:#CC9933; padding:36px 26px;
    border-radius:0 32px 0 40px;
    display:flex; flex-direction:column; justify-content:flex-start;
  }
  .goldpanel .lbl { font-family:'Archivo', Arial, sans-serif; font-weight:800; color:#0a0a0a; font-size:27px; line-height:1.15; text-transform:uppercase; margin-top:8px; }
  .goldpanel .off { font-family:'Anton', Arial, sans-serif; color:#fff; font-size:98px; line-height:0.85; margin-top:210px; }

  .pills { position:absolute; left:28px; top:318px; z-index:3; display:flex; flex-direction:column; gap:10px; }
  .pill {
    display:flex; align-items:center; gap:10px;
    background:rgba(10,10,10,0.72); border:2px solid #CC9933; border-radius:40px;
    padding:10px 20px 10px 14px; width:340px; white-space:nowrap;
  }
  .pill .ico { font-size:22px; width:26px; text-align:center; }
  .pill .lbl { font-family:'Archivo', Arial, sans-serif; font-weight:700; color:#fff; font-size:18px; text-transform:uppercase; letter-spacing:0.2px; }

  .ribbon {
    margin:18px 36px 0; height:210px; background:#0a0a0a; position:relative;
    clip-path: polygon(0 0, 92% 0, 100% 28%, 100% 100%, 0 100%);
    border-radius:28px;
    padding:30px 44px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .ribbon .de { font-family:'Archivo', Arial, sans-serif; color:#CC9933; font-size:26px; text-decoration:line-through; font-weight:700; }
  .ribbon .por-row { display:flex; align-items:baseline; gap:14px; margin-top:2px; }
  .ribbon .por-label { font-family:'Archivo', Arial, sans-serif; color:#fff; font-weight:800; font-size:26px; }
  .ribbon .por-value { font-family:'Anton', Arial, sans-serif; color:#fff; font-size:86px; line-height:0.9; }
  .ribbon .foot-row { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .ribbon .valido { font-family:'Archivo', Arial, sans-serif; color:#fff; font-size:19px; font-weight:600; }
  .ribbon .valido b { color:#CC9933; font-weight:800; }
  .ribbon .economia { font-family:'Archivo', Arial, sans-serif; color:#22C55E; font-size:22px; font-weight:800; text-transform:uppercase; }

  .footer { display:flex; justify-content:space-between; align-items:center; padding:34px 40px 40px; }

  .brand .sub { background:#CC9933; color:#0a0a0a; font-family:'Archivo', Arial, sans-serif; font-weight:800; font-size:14px; padding:5px 10px; border-radius:6px; letter-spacing:0.5px; }

  .cta {
    background:#22C55E; color:#0a0a0a; font-family:'Archivo', Arial, sans-serif; font-weight:800; font-size:24px;
    padding:18px 30px 18px 32px; display:flex; align-items:center; gap:14px;
    clip-path: polygon(0 0, 85% 0, 100% 50%, 85% 100%, 0 100%);

</style>
